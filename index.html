<title>Bé Chơi Chạm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen toy. A nursery-wall world: soft sky, chunky rounded shapes, nothing small. Single deliberate light look. */
:root{
  --sky:#dff1f7;
  --ink:#2f3a4a;
  --sun:#ffc94d;
  --berry:#ff7a8a;
  --leaf:#7ccf8a;
  --card:#fffdf8;
  --muted:#5d6b7c;
  --font-display:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;
  --emoji:min(22vw,22vh);
  color-scheme:light;
}
html,body{height:100%}
body{
  background:var(--sky);color:var(--ink);font-family:var(--font-display);
  overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  box-sizing:border-box;
}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}
.screen[hidden]{display:none!important}

/* Home */
#home{align-items:center;justify-content:center;gap:20px;overflow-y:auto;touch-action:pan-y;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(circle at 80% 12%, #fff6d6 0 12%, transparent 13%), var(--sky)}
#home h1{margin:0;font-size:clamp(34px,8vw,56px);line-height:1;font-weight:800;text-wrap:balance;text-align:center}
#home p{margin:0;color:var(--muted);font-size:17px;text-align:center;max-width:34ch}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:20px;width:min(720px,100%)}
.choice{border:0;border-radius:36px;padding:24px 20px;font:inherit;color:var(--ink);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 8px 0 rgba(47,58,74,.18);transition:transform .12s}
.choice:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(47,58,74,.18)}
.choice:focus-visible,.seg button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.choice .pic{font-size:clamp(60px,15vw,92px);line-height:1}
.choice .name{font-size:28px;font-weight:800}
.choice .sub{font-size:16px;color:var(--muted);font-weight:500}
.c-animal{background:var(--sun)}
.c-pop{background:var(--berry)}

.settings{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 24px;width:min(720px,100%)}
.set{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--muted)}
.seg{display:flex;background:rgba(255,255,255,.6);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;font:inherit;font-weight:700;color:var(--muted);padding:6px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 0 rgba(47,58,74,.12)}
.note{font-size:14px!important;max-width:46ch!important}

/* Parent exit button (hold to leave) */
.exit{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));
  width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.55);color:var(--muted);
  font-size:22px;z-index:5;display:grid;place-items:center;cursor:pointer}
.exit svg{position:absolute;inset:0;transform:rotate(-90deg)}
.exit circle{fill:none;stroke:var(--ink);stroke-width:4;stroke-dasharray:151;stroke-dashoffset:151}
.exit.holding circle{transition:stroke-dashoffset 2s linear;stroke-dashoffset:0}
.hint{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:calc(72px + env(safe-area-inset-left,0px));
  font-size:14px;color:var(--muted);opacity:0;transition:opacity .3s;pointer-events:none;z-index:5}
.hint.show{opacity:1}

/* Animals */
#animals{background:linear-gradient(var(--sky) 62%, var(--leaf) 62%)}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px;
  padding:calc(72px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.grid.six{grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);--emoji:min(19vw,13vh)}
@media (orientation:landscape){.grid.six{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;--emoji:min(13vw,19vh)}}
.animal{border:0;border-radius:32px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  position:relative;box-shadow:0 6px 0 rgba(47,58,74,.15);cursor:pointer;font:inherit;color:var(--ink);min-width:0;min-height:0;transition:opacity .4s, transform .4s}
.animal .e{font-size:var(--emoji);line-height:1.05;display:block;pointer-events:none}
.animal .n{font-size:clamp(18px,4vw,30px);font-weight:800;line-height:1.1;pointer-events:none;text-align:center}
.animal .call{position:absolute;top:8%;left:50%;transform:translate(-50%,10px) scale(.6);opacity:0;
  background:var(--ink);color:#fff;font-weight:800;font-size:clamp(16px,3.6vw,26px);padding:4px 14px;border-radius:999px;white-space:nowrap;
  transition:opacity .2s, transform .3s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
.animal.on .call{opacity:1;transform:translate(-50%,0) scale(1)}
.animal.on .e{animation:hop .7s cubic-bezier(.3,1.6,.5,1)}
.animal.swap{opacity:0;transform:scale(.8)}
@keyframes hop{0%{transform:scale(1)}30%{transform:scale(1.22) translateY(-8%) rotate(-6deg)}60%{transform:scale(.96) rotate(4deg)}100%{transform:scale(1)}}

/* Pop */
#pop{background:#1f2a44}
#pop canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#pop .exit{background:rgba(255,255,255,.12);color:#c9d3e6}
#pop .exit circle{stroke:#fff}
#pop .hint{color:#c9d3e6}

@media (prefers-reduced-motion:reduce){.animal.on .e{animation:none}.choice{transition:none}}
</style>

<section id="home" class="screen">
  <h1>Bé chơi chạm</h1>
  <p>Chọn một trò, rồi đưa máy cho bé.</p>
  <div class="choices">
    <button class="choice c-animal" id="go-animals"><span class="pic">🐮</span><span class="name">Con vật kêu gì?</span><span class="sub">37 con vật, chạm vào để nghe cô đọc tên</span></button>
    <button class="choice c-pop" id="go-pop"><span class="pic">✨</span><span class="name">Chạm đâu nở đó</span><span class="sub">Chạm chỗ nào cũng nở hoa, sao, bong bóng</span></button>
  </div>
  <div class="settings">
    <div class="set">Mỗi màn
      <div class="seg" id="seg-count"><button data-v="4">4 con</button><button data-v="6">6 con</button></div>
    </div>
    <div class="set">Giọng đọc tên
      <div class="seg" id="seg-voice"><button data-v="off">Tắt</button><button data-v="on">Bật</button></div>
    </div>
  </div>
  <p class="note">Giọng đọc tạo bằng Piper với giọng vi_VN-vais1000 (dữ liệu VAIS-1000, CC BY 4.0).</p>
  <p class="note">Bố mẹ đọc to tên và tiếng kêu cùng bé là vui nhất. Để thoát game: giữ nút ở góc trên bên trái khoảng 2 giây.</p>
</section>

<section id="animals" class="screen" hidden>
  <button class="exit" aria-label="Giữ 2 giây để thoát"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/></svg>⌂</button>
  <span class="hint">Giữ để thoát</span>
  <div class="grid" id="grid"></div>
</section>

<section id="pop" class="screen" hidden>
  <canvas id="cv"></canvas>
  <button class="exit" aria-label="Giữ 2 giây để thoát"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/></svg>⌂</button>
  <span class="hint">Giữ để thoát</span>
</section>

<script>
(() => {
  // ---------- Settings (per-device convenience only) ----------
  const prefs = {count:"4", voice:"on"};
  try{ Object.assign(prefs, JSON.parse(localStorage.getItem("bechoi2")||"{}")); }catch(e){}
  function savePrefs(){ try{ localStorage.setItem("bechoi2", JSON.stringify(prefs)); }catch(e){} }
  function bindSeg(id, key){
    const seg = document.getElementById(id);
    const paint = () => seg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===prefs[key]));
    seg.addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return; prefs[key]=b.dataset.v; savePrefs(); paint(); audio(); pluck(N(9),0,.3,.15); });
    paint();
  }
  bindSeg("seg-count","count"); bindSeg("seg-voice","voice");

  // ---------- Audio: soft wooden-xylophone tones through a gentle master chain ----------
  let ac = null, master = null;
  function audio(){
    if(!ac){
      try{
        ac = new (window.AudioContext||window.webkitAudioContext)();
        const lp = ac.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=3200;
        const comp = ac.createDynamicsCompressor(); comp.threshold.value=-20; comp.ratio.value=4;
        master = ac.createGain(); master.gain.value=.7;
        master.connect(lp); lp.connect(comp); comp.connect(ac.destination); master._comp = comp; decodeAll();
      }catch(e){}
    }
    if(ac && ac.state==="suspended") ac.resume();
    return ac;
  }
  // C-major pentatonic, index 0 = C4
  const STEPS=[0,2,4,7,9];
  function N(i){ const oct=Math.floor(i/5), s=STEPS[((i%5)+5)%5]; return 261.63*Math.pow(2,(oct*12+s)/12); }
  function pluck(freq, start=0, dur=.7, vol=.22){
    const a = audio(); if(!a) return;
    const t = a.currentTime + start;
    [[1,vol,1],[4,vol*.1,.25],[2.01,vol*.15,.5]].forEach(([m,v,d])=>{
      const o=a.createOscillator(), g=a.createGain();
      o.type="sine"; o.frequency.setValueAtTime(freq*m,t);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(v,t+.006);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur*d);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.05);
    });
  }

  const buffers = {}; let decoding = false, sampleBus = null;
  function decodeAll(){
    if(decoding || !ac) return; decoding = true;
    sampleBus = ac.createGain(); sampleBus.gain.value = .9; sampleBus.connect(master._comp);
    Object.entries(SOUNDS).forEach(([k,b64])=>{
      try{
        const bin = atob(b64), u = new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
        ac.decodeAudioData(u.buffer, buf=>{ buffers[k]=buf; }, ()=>{});
      }catch(e){}
    });
  }
  let current = null;
  function playClip(k){
    const a = audio(); if(!a || !buffers[k]) return false;
    try{ if(current){ current.g.gain.setTargetAtTime(0,a.currentTime,.05); current.s.stop(a.currentTime+.2); } }catch(e){}
    const s = a.createBufferSource(), g = a.createGain();
    s.buffer = buffers[k]; g.gain.value = 1; s.connect(g); g.connect(sampleBus); s.start();
    current = {s,g}; return true;
  }

  // ---------- Animals ----------
  // size: L = big animal (low notes), M, S = small animal (high notes)
  const ANIMALS = [
    ["🐶","Con chó","Gâu gâu","M","dog"],["🐱","Con mèo","Meo meo","S","cat"],["🐮","Con bò","Ùm bò","L","cow"],
    ["🐷","Con lợn","Ụt ịt","M","pig"],["🐓","Gà trống","Ò ó o","M","chicken"],["🐔","Gà mái","Cục tác","M","hen"],
    ["🐤","Gà con","Chíp chíp","S"],["🦆","Con vịt","Cạp cạp","M","duck"],["🐸","Con ếch","Ộp ộp","S","frog"],
    ["🐑","Con cừu","Be be","M","sheep"],["🐐","Con dê","Be he","M","goat"],["🐦","Con chim","Líu lo","S","bird1"],
    ["🐘","Con voi","Ò ò","L","elephant"],["🦁","Sư tử","Gừm gừm","L","lion"],["🐯","Con hổ","Gầm gừ","L"],
    ["🐴","Con ngựa","Hí hí","M","horse"],["🫏","Con lừa","Be ho","M","donkey"],["🦓","Ngựa vằn","Lóc cóc","M"],["🐵","Con khỉ","Khẹc khẹc","S","monkey"],
    ["🐝","Con ong","Vo ve","S"],["🦋","Con bướm","Bay bay","S"],["🐰","Con thỏ","Tưng tưng","S"],
    ["🐻","Con gấu","Gừ gừ","L"],["🐼","Gấu trúc","Măm măm","L"],["🐭","Con chuột","Chít chít","S"],
    ["🐿️","Con sóc","Rúc rích","S"],["🦉","Con cú","Cú cú","M","owl"],["🦜","Con vẹt","Xin chào","S"],
    ["🐧","Chim cánh cụt","Lạch bạch","M"],["🦒","Hươu cao cổ","Cao ơi là cao","L"],["🐊","Cá sấu","Ngoạm ngoạm","L"],
    ["🐢","Con rùa","Chậm chậm","M"],["🐟","Con cá","Bơi bơi","S"],["🐬","Cá heo","Íc íc","M"],
    ["🐳","Cá voi","Phì phì","L"],["🐙","Bạch tuộc","Ngọ nguậy","M"],["🦀","Con cua","Kẹp kẹp","S"],
  ].map(([e,n,s,z,snd],i)=>({e,n,s,z,snd,i}));

  const BASE = {L:0, M:5, S:9};
  const SHAPES = [[0,2,4],[4,2,0],[0,4,2],[2,0,4],[0,2,0],[4,4,2]];
  function melody(a){
    const words = a.s.split(" ").length, shape = SHAPES[a.i % SHAPES.length], base = BASE[a.z];
    const gap = a.z==="L" ? .26 : a.z==="M" ? .2 : .15;
    // a little "hop" note, then one note per word of the call, then a soft landing
    pluck(N(base+7), 0, .25, .1);
    for(let k=0;k<Math.min(words,3);k++) pluck(N(base+shape[k]), .1 + k*gap, a.z==="L" ? 1 : .7, .22);
    pluck(N(base+5), .1 + Math.min(words,3)*gap + .05, .9, .14);
  }

  const CARD_COLORS = ["#fffdf8","#fff4dc","#ffeef0","#eef8ee","#eef3ff","#fdf0e2"];
  const grid = document.getElementById("grid");
  let deck = [], shown = [], taps = 0;

  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  // Walk through all animals before repeating any.
  function nextSet(){
    const n = +prefs.count;
    if(deck.length < n) deck = deck.concat(shuffle(ANIMALS.filter(a=>!deck.includes(a))));
    shown = deck.splice(0,n);
  }
  function renderGrid(){
    grid.className = "grid" + (prefs.count==="6" ? " six" : "");
    grid.innerHTML = "";
    shown.forEach((a,i)=>{
      const b = document.createElement("button");
      b.className = "animal"; b.style.background = CARD_COLORS[i];
      b.setAttribute("aria-label", a.n);
      b.innerHTML = `<span class="call">${a.s}!</span><span class="e">${a.e}</span><span class="n">${a.n}</span>`;
      b.addEventListener("pointerdown", ev => { ev.preventDefault(); tapAnimal(b,a); });
      grid.appendChild(b);
    });
  }
  let swapping = false;
  function tapAnimal(el, a){
    if(swapping) return;
    audio();
    el.classList.remove("on"); void el.offsetWidth; el.classList.add("on");
    pluck(N(BASE[a.z]+5), 0, .5, .09);
    if(prefs.voice!=="off") setTimeout(()=>{ if(!playClip("v"+String(a.i).padStart(2,"0"))) melody(a); }, 120);
    else melody(a);
    clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove("on"), 2200);
    taps++;
    if(taps % 8 === 0){
      swapping = true;
      setTimeout(()=>{
        grid.querySelectorAll(".animal").forEach(c=>c.classList.add("swap"));
        [0,1,2,3,4].forEach(k=>pluck(N(10+k),k*.07,.4,.1));
        setTimeout(()=>{ nextSet(); renderGrid(); swapping = false; }, 450);
      }, 2200);
    }
  }

  // ---------- Pop ----------
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const COLORS = ["#ffc94d","#ff7a8a","#7ccf8a","#7fc8f8","#c59bff","#ffa45c"];
  let parts = [], blooms = [], running = false, dpr = 1, lastNote = 0;
  function resize(){ dpr = Math.min(2, window.devicePixelRatio||1); cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; }
  addEventListener("resize", resize);

  function star(x,y,r,rot){ ctx.beginPath(); for(let i=0;i<10;i++){ const rr = i%2? r*.45 : r, a = rot + i*Math.PI/5; ctx.lineTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr);} ctx.closePath(); ctx.fill(); }
  function heart(x,y,r){ ctx.beginPath(); ctx.moveTo(x,y+r*.6); ctx.bezierCurveTo(x+r*1.2,y-r*.2,x+r*.6,y-r*1.1,x,y-r*.35); ctx.bezierCurveTo(x-r*.6,y-r*1.1,x-r*1.2,y-r*.2,x,y+r*.6); ctx.fill(); }
  function flower(x,y,r,c){ ctx.fillStyle=c; for(let i=0;i<5;i++){ const a=i*Math.PI*2/5; ctx.beginPath(); ctx.arc(x+Math.cos(a)*r*.55,y+Math.sin(a)*r*.55,r*.42,0,7); ctx.fill(); } ctx.fillStyle="#fff6d6"; ctx.beginPath(); ctx.arc(x,y,r*.32,0,7); ctx.fill(); }

  function burst(x,y,quiet){
    const c = COLORS[Math.floor(Math.random()*COLORS.length)];
    const kind = ["flower","star","heart","ball"][Math.floor(Math.random()*4)];
    blooms.push({x,y,c,kind,t:0,max:Math.min(innerWidth,innerHeight)*(.14+Math.random()*.06),rot:Math.random()*6});
    for(let i=0;i<14;i++){
      const a = Math.random()*Math.PI*2, sp = 2+Math.random()*5;
      parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,r:6+Math.random()*10,c:COLORS[Math.floor(Math.random()*COLORS.length)],life:1});
    }
    // higher on screen = higher note; never more than one note every 90 ms
    const now = performance.now();
    if(now - lastNote > 90){
      lastNote = now;
      const idx = 5 + Math.max(0,Math.min(9, Math.floor((1 - y/innerHeight)*10)));
      pluck(N(idx),0,.8,quiet ? .1 : .2);
    }
    if(blooms.length>40) blooms.shift();
  }
  function frame(){
    if(!running) return;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,innerWidth,innerHeight);
    blooms.forEach(b=>{
      b.t += 1/60;
      const grow = Math.min(1, b.t/.35), ease = 1 - Math.pow(1-grow,3) * Math.cos(grow*4)*.3;
      const fade = b.t > 2.2 ? Math.max(0, 1-(b.t-2.2)/1) : 1;
      const r = b.max*ease, y = b.y - b.t*12;
      ctx.globalAlpha = fade;
      ctx.fillStyle = b.c;
      if(b.kind==="flower") flower(b.x,y,r,b.c);
      else if(b.kind==="star") star(b.x,y,r,b.rot+b.t*.6);
      else if(b.kind==="heart") heart(b.x,y,r);
      else { ctx.beginPath(); ctx.arc(b.x,y,r*.8,0,7); ctx.fill(); ctx.fillStyle="rgba(255,255,255,.45)"; ctx.beginPath(); ctx.arc(b.x-r*.28,y-r*.28,r*.2,0,7); ctx.fill(); }
    });
    blooms = blooms.filter(b=>b.t<3.2);
    parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.12; p.life-=.016; ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life,0,7); ctx.fill(); });
    parts = parts.filter(p=>p.life>0);
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  cv.addEventListener("pointerdown", e => { e.preventDefault(); audio(); burst(e.clientX, e.clientY); });
  cv.addEventListener("pointermove", e => { if(e.buttons && Math.random()<.15) burst(e.clientX, e.clientY, true); });

  // ---------- Screens ----------
  const screens = {home:document.getElementById("home"), animals:document.getElementById("animals"), pop:document.getElementById("pop")};
  let wake = null;
  function show(name){
    Object.entries(screens).forEach(([k,el])=> el.hidden = k!==name);
    running = name==="pop";
    if(running){ resize(); requestAnimationFrame(frame); }
    if(name==="home"){
      try{ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }catch(e){}
      try{ wake && wake.release(); wake=null; }catch(e){}
    } else {
      try{ document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){}
      try{ navigator.wakeLock && navigator.wakeLock.request("screen").then(w=>wake=w).catch(()=>{}); }catch(e){}
    }
  }
  const startJingle = () => [0,2,4].forEach((k,j)=>pluck(N(5+k),j*.1,.5,.16));
  document.getElementById("go-animals").addEventListener("click", ()=>{ audio(); nextSet(); renderGrid(); show("animals"); startJingle(); });
  document.getElementById("go-pop").addEventListener("click", ()=>{ audio(); parts=[]; blooms=[]; show("pop"); startJingle(); });

  // Hold-to-exit for parents
  document.querySelectorAll(".exit").forEach(btn=>{
    const hint = btn.parentElement.querySelector(".hint");
    let timer = null;
    const start = e => { e.preventDefault(); e.stopPropagation(); btn.classList.add("holding"); hint.classList.add("show"); timer = setTimeout(()=>{ cancel(); show("home"); }, 2000); };
    const cancel = () => { clearTimeout(timer); btn.classList.remove("holding"); setTimeout(()=>hint.classList.remove("show"), 800); };
    btn.addEventListener("pointerdown", start);
    ["pointerup","pointerleave","pointercancel"].forEach(t=>btn.addEventListener(t, cancel));
  });

  // Block stray gestures inside the games (zoom, long-press menu, scroll)
  ["contextmenu","gesturestart","dblclick"].forEach(t=>document.addEventListener(t, e=>e.preventDefault()));
  document.addEventListener("touchmove", e=>{ if(screens.home.hidden) e.preventDefault(); }, {passive:false});
})();
</script>
